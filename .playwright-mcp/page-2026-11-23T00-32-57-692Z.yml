      - list [ref=f5e13]:
        - listitem [ref=f5e14]: Click sun as it falls or pops out of Sunbloom (it also drifts to you after a few seconds).
        - listitem [ref=f5e15]: Pick a seed packet (1–9), then click a square to plant it. Each packet takes time to recharge.
        - listitem [ref=f5e16]: Mudlings eat your plants. A lawn mower in each lane gives one last sweep, but only once.
        - listitem [ref=f5e17]: Shovel (S) digs up a plant. Spud Mines need time to arm. Diggers come from behind.
        - listitem [ref=f5e18]: The Moonlit Lawn has no sky sun, only Sunbloom. The Pond needs a Lily Pad under anything planted on water.
        - listitem [ref=f5e19]: Clear levels to unlock new plants and bigger seed trays. A Mud Giant ends every world.
