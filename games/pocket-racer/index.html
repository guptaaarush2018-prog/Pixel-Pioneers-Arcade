<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Pocket Racer · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
</head>
<body class="game" data-game="pocket-racer">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Pocket Racer</h1>
    <div class="stats">
      <span>Lap<b id="lap">1/3</b></span>
      <span>Position<b id="pos">-</b></span>
      <span>Time<b id="time">0.0</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help"><kbd>↑</kbd> gas · <kbd>↓</kbd> brake · <kbd>←</kbd><kbd>→</kbd> steer · <kbd>P</kbd> pause</p>
  <div class="touchpad">
    <button id="left" type="button">◀</button>
    <button id="brake" type="button">Brake</button>
    <button id="right" type="button">▶</button>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="game.js"></script>
</body>
</html>
