<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Pocket Racer · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
  <link rel="stylesheet" href="racer.css">
</head>
<body class="game racer in-menu" data-game="pocket-racer">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1><span class="logo">POCKET<b>RACER</b></span></h1>
    <nav class="racer-nav" id="nav" aria-label="Pocket Racer">
      <button type="button" data-go="home">Home</button>
      <button type="button" data-go="career">Career</button>
      <button type="button" data-go="quick">Race</button>
      <button type="button" data-go="garage">Garage</button>
      <button type="button" data-go="records">Records</button>
      <button type="button" data-go="builder">Builder</button>
    </nav>
    <span class="wallet" id="wallet" title="Coins and stars"><span class="coin">●</span><b id="coins">0</b><span class="star">★</span><b id="stars">0</b></span>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="game"></canvas>

    <!-- Race HUD, laid over the canvas -->
    <div class="hud" id="hud" hidden>
      <div class="hud-top">
        <div class="hud-card hud-pos"><small>Pos</small><b id="pos">1</b><span id="pos-of">/4</span></div>
        <div class="hud-card hud-lap"><small>Lap</small><b id="lap">1/3</b></div>
        <div class="hud-card hud-time"><small>Time</small><b id="time">0.00</b><span id="best">Best –</span></div>
        <button class="hud-pause" id="pause" type="button" aria-label="Pause">❚❚</button>
      </div>
      <ol class="tower" id="tower"></ol>
      <canvas class="minimap" id="minimap" width="160" height="112"></canvas>
      <div class="lights" id="lights" hidden><i></i><i></i><i></i></div>
      <div class="banner" id="banner"></div>
      <div class="gap" id="gap"></div>
      <div class="speedo" id="speedo"><b id="speed">0</b><small>km/h</small></div>
    </div>

    <!-- Touch driving controls (phones and tablets) -->
    <div class="drive-pad touch-only" id="pad" hidden>
      <div class="pad-side">
        <button type="button" data-key="left" aria-label="Steer left">◀</button>
        <button type="button" data-key="right" aria-label="Steer right">▶</button>
      </div>
      <div class="pad-side">
        <button type="button" class="brake" data-key="down" aria-label="Brake">BRAKE</button>
      </div>
    </div>

    <!-- Menus: home, career, garage and the rest -->
    <div class="screens" id="screens"></div>

    <div class="overlay" id="overlay" hidden></div>
  </main>

  <div class="toolbar" id="editor" hidden>
    <button class="btn secondary" id="ed-undo" type="button">Undo</button>
    <button class="btn secondary" id="ed-delete" type="button">Delete corner</button>
    <button class="btn secondary" id="ed-reverse" type="button">Reverse</button>
    <button class="btn secondary" id="ed-theme" type="button">Theme</button>
    <button class="btn secondary" id="ed-clear" type="button">Clear</button>
    <button class="btn" id="ed-save" type="button">Save</button>
    <button class="btn secondary" id="ed-exit" type="button">Exit</button>
  </div>
  <p class="help kbd-only" id="help" hidden><kbd>↑</kbd> gas · <kbd>↓</kbd> brake · <kbd>←</kbd><kbd>→</kbd> steer · <kbd>P</kbd> pause · <kbd>R</kbd> restart · <kbd>C</kbd> camera</p>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/filter.js"></script>
  <script src="../../assets/js/friends.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/chat.js"></script>
  <script src="../../assets/js/invites.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="data.js"></script>
  <script src="sound.js"></script>
  <script src="art.js"></script>
  <script src="game.js"></script>
</body>
</html>
