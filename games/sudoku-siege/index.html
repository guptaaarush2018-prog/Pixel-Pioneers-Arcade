<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Sudoku Siege · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
</head>
<body class="game" data-game="sudoku-siege">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Sudoku Siege</h1>
    <div class="stats">
      <span>Time<b id="time">0:00</b></span>
      <span>Mistakes<b id="mistakes">0</b></span>
      <span>Mode<b id="mode">-</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help">Click a cell, type <kbd>1</kbd>–<kbd>9</kbd> · arrows move · <kbd>N</kbd> notes · <kbd>⌫</kbd> erase · <kbd>Esc</kbd> pauses</p>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="game.js"></script>
</body>
</html>
