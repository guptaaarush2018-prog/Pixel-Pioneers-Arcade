<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9a45"/><stop offset="1" stop-color="#3b7f37"/></linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f78c4"/><stop offset=".5" stop-color="#4a9ee6"/><stop offset="1" stop-color="#2f78c4"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9ccd3"/><stop offset=".55" stop-color="#a5aab4"/><stop offset="1" stop-color="#7e8490"/></linearGradient>
    <radialGradient id="well"><stop offset="0" stop-color="#e7d1ff"/><stop offset=".35" stop-color="#b57cff"/><stop offset="1" stop-color="#b57cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="sh"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="boom"><stop offset="0" stop-color="#fff6c2"/><stop offset=".5" stop-color="#ffb347" stop-opacity=".8"/><stop offset="1" stop-color="#ff6b3d" stop-opacity="0"/></radialGradient>
    <g id="tower">
      <ellipse cx="0" cy="2" rx="26" ry="7" fill="url(#sh)"/>
      <rect x="-18" y="-50" width="36" height="52" fill="url(#stone)"/>
      <g fill="#8a909c"><rect x="-18" y="-38" width="36" height="2"/><rect x="-18" y="-24" width="36" height="2"/><rect x="-18" y="-10" width="36" height="2"/></g>
      <rect x="-22" y="-58" width="44" height="10" fill="#b8bcc5"/>
      <g fill="#b8bcc5"><rect x="-22" y="-64" width="8" height="7"/><rect x="-4" y="-64" width="8" height="7"/><rect x="14" y="-64" width="8" height="7"/></g>
      <path d="M-7 2 v-12 a7 7 0 0 1 14 0 v12z" fill="#2b2420"/>
      <rect x="-1" y="-86" width="2" height="24" fill="#5b4632"/>
    </g>
    <g id="knight">
      <ellipse cx="0" cy="1" rx="8" ry="3" fill="#000" opacity=".3"/>
      <rect x="-5" y="-12" width="10" height="12" rx="3"/>
      <circle cx="0" cy="-16" r="6" fill="#d7dbe2"/><rect x="-6" y="-17" width="12" height="2" fill="#5b6270"/>
    </g>
  </defs>

  <rect width="320" height="200" fill="url(#grass)"/>
  <g fill="#5aa84f" opacity=".6">
    <rect x="0" y="0" width="40" height="40"/><rect x="80" y="0" width="40" height="40"/><rect x="200" y="0" width="40" height="40"/><rect x="280" y="0" width="40" height="40"/>
    <rect x="40" y="40" width="40" height="40"/><rect x="240" y="40" width="40" height="40"/>
    <rect x="0" y="80" width="40" height="40"/><rect x="80" y="80" width="40" height="40"/><rect x="200" y="80" width="40" height="40"/><rect x="280" y="80" width="40" height="40"/>
    <rect x="40" y="120" width="40" height="40"/><rect x="240" y="120" width="40" height="40"/>
  </g>
  <!-- lane path -->
  <rect x="0" y="92" width="320" height="44" rx="8" fill="#c9a96e"/>
  <rect x="0" y="92" width="320" height="4" fill="#e0c68e"/>
  <g fill="#a98b55" opacity=".7"><circle cx="40" cy="120" r="2.5"/><circle cx="98" cy="106" r="2"/><circle cx="224" cy="126" r="2.5"/><circle cx="270" cy="110" r="2"/></g>
  <!-- river and bridge -->
  <rect x="140" y="0" width="40" height="200" fill="url(#river)"/>
  <g stroke="#bfe3ff" stroke-width="1.5" opacity=".6" stroke-linecap="round"><path d="M150 20v10"/><path d="M168 52v12"/><path d="M152 160v10"/><path d="M170 182v8"/></g>
  <rect x="132" y="86" width="56" height="56" fill="#6b4a2e"/>
  <g fill="#8a6440"><rect x="132" y="88" width="56" height="7"/><rect x="132" y="98" width="56" height="7"/><rect x="132" y="108" width="56" height="7"/><rect x="132" y="118" width="56" height="7"/><rect x="132" y="128" width="56" height="7"/></g>
  <!-- rune well -->
  <circle cx="160" cy="114" r="30" fill="url(#well)"/>
  <circle cx="160" cy="116" r="10" fill="#3a2a5a" stroke="#d6b8ff" stroke-width="2"/>
  <path d="M160 108 l5 8 -5 8 -5 -8z" fill="#e7d1ff"/>

  <!-- trees -->
  <g>
    <ellipse cx="62" cy="36" rx="16" ry="5" fill="url(#sh)"/><circle cx="58" cy="26" r="13" fill="#2f7d3f"/><circle cx="54" cy="22" r="8" fill="#3fa053"/>
    <ellipse cx="262" cy="182" rx="16" ry="5" fill="url(#sh)"/><circle cx="258" cy="172" r="13" fill="#2f7d3f"/><circle cx="254" cy="168" r="8" fill="#3fa053"/>
    <ellipse cx="106" cy="186" rx="12" ry="4" fill="url(#sh)"/><circle cx="104" cy="178" r="10" fill="#2f7d3f"/><circle cx="101" cy="175" r="6" fill="#3fa053"/>
  </g>

  <!-- towers -->
  <g transform="translate(46 122)"><use href="#tower"/><path d="M1 -86 l16 4 -16 5z" fill="#3d7bff"/><rect x="-22" y="-74" width="44" height="5" rx="2.5" fill="#1b2433"/><rect x="-21" y="-73" width="34" height="3" rx="1.5" fill="#4f8cff"/></g>
  <g transform="translate(276 122)"><use href="#tower"/><path d="M1 -86 l16 4 -16 5z" fill="#ff4a4a"/><rect x="-22" y="-74" width="44" height="5" rx="2.5" fill="#1b2433"/><rect x="-21" y="-73" width="14" height="3" rx="1.5" fill="#ff5c5c"/></g>

  <!-- clash on the bridge -->
  <g fill="#3d7bff">
    <g transform="translate(144 124)"><use href="#knight"/></g>
    <g transform="translate(130 112)"><use href="#knight"/></g>
    <g transform="translate(118 128) scale(.8)"><use href="#knight"/></g>
  </g>
  <g fill="#e04848">
    <g transform="translate(176 120) scale(-1 1)"><use href="#knight"/></g>
    <g transform="translate(190 132) scale(-1 1)"><use href="#knight"/></g>
  </g>
  <!-- brute -->
  <g transform="translate(208 116)">
    <ellipse cx="0" cy="2" rx="15" ry="5" fill="#000" opacity=".3"/>
    <rect x="-12" y="-26" width="24" height="26" rx="8" fill="#8a5bd1"/>
    <circle cx="0" cy="-30" r="9" fill="#9fc56a"/><circle cx="-3" cy="-31" r="1.5" fill="#1b1e24"/>
    <rect x="-22" y="-22" width="12" height="6" rx="3" fill="#6d4523" transform="rotate(-30 -16 -19)"/>
  </g>
  <!-- swords clash -->
  <circle cx="160" cy="108" r="12" fill="url(#boom)"/>
  <g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M152 100l16 16"/><path d="M168 100l-16 16"/></g>
  <!-- arrow from bowmen to red tower -->
  <path d="M84 74 Q170 30 262 62" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7"/>
  <path d="M262 62 l-8 -1 4 -5z" fill="#fff"/>
  <circle cx="268" cy="64" r="10" fill="url(#boom)"/>

  <!-- card hand -->
  <g transform="translate(96 160)">
    <rect x="0" y="0" width="128" height="40" rx="8" fill="rgba(20,16,40,.82)"/>
    <g>
      <rect x="6" y="5" width="34" height="38" rx="5" fill="#4f6fd9" stroke="#ffd34d" stroke-width="2"/><circle cx="23" cy="20" r="8" fill="#d7dbe2"/>
      <rect x="47" y="5" width="34" height="38" rx="5" fill="#7a4fd1"/><circle cx="64" cy="20" r="8" fill="#9fc56a"/>
      <rect x="88" y="5" width="34" height="38" rx="5" fill="#d1874f"/><path d="M97 26 l8 -14 8 14z" fill="#ffe066"/>
    </g>
    <g font-family="system-ui,sans-serif" font-weight="900" font-size="9" fill="#fff" text-anchor="middle">
      <path d="M8 4 l5 -5 5 5 -5 5z" fill="#c084fc"/><text x="13" y="7">2</text>
      <path d="M49 4 l5 -5 5 5 -5 5z" fill="#c084fc"/><text x="54" y="7">5</text>
      <path d="M90 4 l5 -5 5 5 -5 5z" fill="#c084fc"/><text x="95" y="7">3</text>
    </g>
  </g>
</svg>
