<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Rune Rumble · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
</head>
<body class="game" data-game="rune-rumble">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Rune Rumble</h1>
    <div class="stats">
      <span>Time<b id="time">3:00</b></span>
      <span>Your crowns<b id="you">0</b></span>
      <span>Theirs<b id="them">0</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help">Pick a card (click or <kbd>1</kbd>–<kbd>4</kbd>), then click a lane on your side · Fireball can land anywhere · <kbd>P</kbd> pause</p>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="game.js"></script>
</body>
</html>
