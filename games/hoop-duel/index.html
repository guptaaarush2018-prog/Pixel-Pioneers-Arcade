<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Hoop Duel · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
</head>
<body class="game" data-game="hoop-duel">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Hoop Duel</h1>
    <div class="stats">
      <span>You<b id="you">0</b></span>
      <span>Them<b id="them">0</b></span>
      <span>Ball<b id="ball">-</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help"><kbd>←</kbd><kbd>→</kbd> move · <kbd>↑</kbd> jump / block · hold <kbd>Space</kbd> shoot, tap to steal · <kbd>Space</kbd> in the air by the rim to dunk · <kbd>P</kbd> pause</p>
  <div class="touchpad">
    <button id="t-left" type="button">◀</button>
    <button id="t-right" type="button">▶</button>
    <button id="t-jump" type="button">Jump</button>
    <button id="t-shoot" type="button">Shoot</button>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/filter.js"></script>
  <script src="../../assets/js/friends.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/chat.js"></script>
  <script src="../../assets/js/invites.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="game.js"></script>
</body>
</html>
