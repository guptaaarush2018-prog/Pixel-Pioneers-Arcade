<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Putt Planet · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
</head>
<body class="game" data-game="putt-planet">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Putt Planet</h1>
    <div class="stats">
      <span>Hole<b id="hole">1/12</b></span>
      <span>Strokes<b id="strokes">0</b></span>
      <span>To par<b id="topar">E</b></span>
      <span>Best<b id="best">0</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help">Drag back and release to putt · or <kbd>←→</kbd> aim, <kbd>↑↓</kbd> power, <kbd>Space</kbd> putt · <kbd>P</kbd> pause</p>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/filter.js"></script>
  <script src="../../assets/js/friends.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/chat.js"></script>
  <script src="../../assets/js/invites.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="../../assets/js/versus.js"></script>
  <script src="game.js"></script>
</body>
</html>
