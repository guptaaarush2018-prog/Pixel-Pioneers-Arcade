<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Chess · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
</head>
<body class="game" data-game="chess">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Chess</h1>
    <div class="stats">
      <span>Mode<b id="mode">Classic</b></span>
      <span>Material<b id="material">0</b></span>
      <span>Turn<b id="turn">-</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <div class="toolbar">
    <button class="btn secondary" type="button" id="undo" disabled>Undo</button>
    <button class="btn secondary" type="button" id="resign" disabled>Resign</button>
  </div>
  <div class="move-list" id="moves"></div>
  <p class="help">Click a piece, then a highlighted square · a pawn reaching the far side lets you pick its promotion</p>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/filter.js"></script>
  <script src="../../assets/js/friends.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/chat.js"></script>
  <script src="../../assets/js/invites.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="../../assets/js/match.js"></script>
  <script src="game.js"></script>
</body>
</html>
