<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Crowd Rush · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
</head>
<body class="game" data-game="crowd-rush">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Crowd Rush</h1>
    <div class="stats">
      <span>Level<b id="level">1</b></span>
      <span>Crowd<b id="crowd">10</b></span>
      <span>Score<b id="score">0</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help">Drag, or use <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> to steer · <kbd>P</kbd> pause</p>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="game.js"></script>
</body>
</html>
