<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Broadside · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
  <style>
    .bs-shop { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
    .bs-shop .btn { flex-direction: column; line-height: 1.25; padding: 9px 6px; font-size: 14px; }
    .bs-shop small { font-weight: 500; font-size: 11px; opacity: .8; }
    .bs-shop .btn[disabled] { opacity: .45; }
    @media (max-width: 560px) { .bs-shop { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="game" data-game="broadside">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Broadside</h1>
    <div class="stats">
      <span>Score<b id="score">0</b></span>
      <span>Wave<b id="wave">-</b></span>
      <span>Best<b id="best">0</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help"><kbd>A</kbd>/<kbd>D</kbd> steer · <kbd>W</kbd>/<kbd>S</kbd> sails up / down · <kbd>Q</kbd> port broadside · <kbd>E</kbd> starboard · <kbd>Space</kbd> fire at the nearest · <kbd>P</kbd> pause</p>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/gfx.js"></script>
  <script src="../../assets/js/filter.js"></script>
  <script src="../../assets/js/friends.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/chat.js"></script>
  <script src="../../assets/js/invites.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="../../assets/js/versus.js"></script>
  <script src="game.js"></script>
</body>
</html>
