<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Comet Pinball · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
</head>
<body class="game" data-game="comet-pinball">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Comet Pinball</h1>
    <div class="stats">
      <span>Score<b id="score">0</b></span>
      <span>Ball<b id="ball">1/3</b></span>
      <span>Bonus<b id="mult">x1</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help"><kbd>←</kbd><kbd>→</kbd> or <kbd>Z</kbd><kbd>/</kbd> flip · hold <kbd>Space</kbd> to launch · <kbd>P</kbd> pause</p>
  <div class="touchpad">
    <button id="t-left" type="button">◀ Flip</button>
    <button id="t-launch" type="button">Launch</button>
    <button id="t-right" type="button">Flip ▶</button>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="../../assets/js/versus.js"></script>
  <script src="game.js"></script>
</body>
</html>
