    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a5f"/><stop offset="1" stop-color="#e2582f"/></linearGradient>
    <linearGradient id="kit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a4038"/><stop offset="1" stop-color="#3a2a24"/></linearGradient>
