<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Getaway City · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
  <style>
    .gc-cash { font-size: 22px !important; font-weight: 800; color: var(--accent) !important; margin-bottom: 12px !important; }
    .gc-list { display: grid; gap: 8px; margin: 0 0 16px; text-align: left; max-height: min(50vh, 360px); overflow-y: auto; padding-right: 4px; }
    .gc-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
    .gc-ico { font-size: 22px; width: 28px; text-align: center; }
    .gc-info { flex: 1; min-width: 0; font-size: 14px; }
    .gc-info em { font-style: normal; font-size: 12px; color: var(--accent); margin-left: 4px; }
    .gc-info small { display: block; font-size: 12px; color: var(--muted); }
    .gc-buy { padding: 8px 12px; font-size: 14px; min-width: 84px; justify-content: center; }
    .gc-buy:disabled { opacity: .45; cursor: not-allowed; filter: none; }
    .gc-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .gc-tabs .btn { flex: 1; padding: 6px; font-size: 14px; }
    .gl-wrap { position: relative; }
    .gl-wrap #hud { position: absolute; left: 0; top: 0; pointer-events: none; border: none; }
    .stage canvas[hidden], .gl-wrap[hidden] { display: none; }
  </style>
</head>
<body class="game" data-game="getaway-city">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Getaway City</h1>
    <div class="stats">
      <span>Cash<b id="cash">-</b></span>
      <span>Wanted<b id="wanted">-</b></span>
      <span>Earned<b id="earned">-</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="gl-wrap" id="glwrap" hidden><canvas id="game3d"></canvas><canvas id="hud"></canvas></div>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help"><kbd>WASD</kbd> / arrows drive or walk · <kbd>E</kbd> get in or out · <kbd>Space</kbd> handbrake · <kbd>Shift</kbd> nitro or sprint · <kbd>M</kbd> map · <kbd>C</kbd> look back · <kbd>V</kbd> 3D / Classic view · <kbd>P</kbd> pause · on touch, drag to steer</p>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js?v=20261123"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/gfx.js"></script>
  <script src="../../assets/js/gl3d.js"></script>
  <script src="../../assets/js/filter.js"></script>
  <script src="../../assets/js/friends.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/chat.js"></script>
  <script src="../../assets/js/invites.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="../../assets/js/live.js"></script>
  <script src="game.js"></script>
</body>
</html>
