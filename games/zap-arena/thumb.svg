<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05060d"/><stop offset="1" stop-color="#121729"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2030"/><stop offset="1" stop-color="#262d42"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ef0ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <!-- far wall with glowing trim -->
  <rect x="0" y="70" width="320" height="40" fill="#252c40"/>
  <rect x="0" y="69" width="320" height="2" fill="#33e0ff" filter="url(#gl)"/>
  <!-- checkered floor in perspective -->
  <polygon points="0,110 320,110 320,200 0,200" fill="url(#floor)"/>
  <g fill="#2c3550" opacity=".9">
    <polygon points="40,110 80,110 40,140 -10,140"/><polygon points="120,110 160,110 150,140 100,140"/><polygon points="200,110 240,110 260,140 210,140"/><polygon points="280,110 320,110 330,140 300,140"/>
    <polygon points="-10,140 40,140 0,200 -60,200"/><polygon points="100,140 150,140 140,200 70,200"/><polygon points="210,140 260,140 290,200 220,200"/>
  </g>
  <!-- crates with neon edges -->
  <g>
    <rect x="18" y="82" width="56" height="46" fill="#c87a34"/><polygon points="74,82 86,76 86,120 74,128" fill="#9a5c24"/><polygon points="18,82 30,76 86,76 74,82" fill="#e09a52"/>
    <path d="M18 82 L30 76 L86 76 L74 82 Z" fill="none" stroke="#33e0ff" stroke-width="1.5" filter="url(#gl)"/>
    <rect x="236" y="88" width="48" height="40" fill="#3fb6a8"/><polygon points="236,88 226,82 226,122 236,128" fill="#2b8a7f"/><polygon points="226,82 274,82 284,88 236,88" fill="#5fd3c5"/>
    <path d="M226 82 L274 82 L284 88 L236 88 Z" fill="none" stroke="#33e0ff" stroke-width="1.5" filter="url(#gl)"/>
  </g>
  <!-- robot bot -->
  <g transform="translate(144 82)">
    <ellipse cx="16" cy="66" rx="18" ry="4" fill="#000" opacity=".4"/>
    <rect x="6" y="40" width="8" height="25" fill="#6a1f2c"/><rect x="18" y="40" width="8" height="25" fill="#6a1f2c"/>
    <rect x="0" y="16" width="32" height="26" fill="#ff4f6d"/><rect x="-8" y="20" width="8" height="16" fill="#6a1f2c"/>
    <rect x="4" y="0" width="24" height="17" fill="#e6e9f0"/>
    <rect x="6" y="5" width="20" height="5" fill="#ff7a90" filter="url(#gl)"/>
    <rect x="15" y="-7" width="2" height="7" fill="#6a1f2c"/><rect x="14" y="-10" width="4" height="4" fill="#ff7a90" filter="url(#gl)"/>
    <rect x="30" y="24" width="16" height="7" fill="#2a2f3a"/>
    <text x="16" y="-16" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="9" fill="#ff4f6d" stroke="#000" stroke-opacity=".6" stroke-width="2" paint-order="stroke">Volt</text>
  </g>
  <!-- laser beam from your blaster to the bot, with sparks -->
  <polygon points="240,168 252,172 165,104 161,101" fill="url(#beam)" opacity=".85" filter="url(#gl)"/>
  <g fill="#bff8ff" filter="url(#gl)"><rect x="156" y="88" width="4" height="4"/><rect x="166" y="84" width="3" height="3"/><rect x="151" y="94" width="3" height="3"/><rect x="170" y="92" width="3" height="3"/></g>
  <!-- your blaster -->
  <g>
    <polygon points="226,200 248,150 292,150 300,200" fill="#33394a"/>
    <polygon points="248,150 256,128 284,128 292,150" fill="#262b38"/>
    <polygon points="252,152 258,134 262,134 256,152" fill="#3fe9ff" filter="url(#gl)"/>
  </g>
  <!-- crosshair and hit marker -->
  <g stroke="#fff" stroke-width="2"><line x1="160" y1="88" x2="160" y2="94"/><line x1="160" y1="106" x2="160" y2="112"/><line x1="148" y1="100" x2="154" y2="100"/><line x1="166" y1="100" x2="172" y2="100"/></g>
  <text x="160" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="20" fill="#ffd23f" stroke="#000" stroke-opacity=".6" stroke-width="4" paint-order="stroke">HEADSHOT TAG!</text>
  <!-- HUD -->
  <rect x="8" y="172" width="78" height="20" rx="6" fill="#141a28" fill-opacity=".85"/>
  <text x="15" y="187" font-family="system-ui,sans-serif" font-weight="900" font-size="13" fill="#7ef0ff">100</text>
  <rect x="42" y="179" width="38" height="7" rx="3.5" fill="#3fd6e8"/>
  <rect x="120" y="6" width="80" height="20" rx="6" fill="#141a28" fill-opacity=".85"/>
  <text x="160" y="20" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="11" fill="#fff">2:41 · You 12</text>
</svg>
