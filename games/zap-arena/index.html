<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Zap Arena · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
  <style>
    .gl-wrap { position: relative; }
    .gl-wrap #hud { position: absolute; left: 0; top: 0; pointer-events: none; border: none; }
    .za-pick { display: flex; gap: 6px; margin: 4px 0 10px; }
    .za-pick .btn { flex: 1; padding: 7px 4px; font-size: 14px; flex-direction: column; line-height: 1.2; }
    .za-pick small { font-weight: 400; opacity: .8; font-size: 11px; }
    .za-label { text-align: left; font-size: 12px; color: var(--muted); margin: 0; }
    .za-board { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
    .za-board td { padding: 3px 6px; text-align: left; }
    .za-board td:last-child { text-align: right; }
    .za-board tr.me td { color: var(--accent); font-weight: 700; }
  </style>
</head>
<body class="game" data-game="zap-arena">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Zap Arena</h1>
    <div class="stats">
      <span>Tags<b id="tags">0</b></span>
      <span>Time<b id="clock">-</b></span>
      <span>Best<b id="best">0</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <div class="gl-wrap"><canvas id="game"></canvas><canvas id="hud"></canvas></div>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help">Click to aim · <kbd>WASD</kbd> move · <kbd>Space</kbd> jump (hold to bunny hop) · <kbd>Shift</kbd> slide · click to zap · right click to zoom · <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> or scroll to switch · <kbd>R</kbd> reload · <kbd>Esc</kbd> pause</p>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js?v=20261123"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/gfx.js"></script>
  <script src="../../assets/js/gl3d.js"></script>
  <script src="../../assets/js/filter.js"></script>
  <script src="../../assets/js/friends.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/chat.js"></script>
  <script src="../../assets/js/invites.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="../../assets/js/versus.js"></script>
  <script src="game.js"></script>
</body>
</html>
