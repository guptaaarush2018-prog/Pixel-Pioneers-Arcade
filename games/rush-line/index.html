<!doctype html>
<html lang="en">

<body class="game" data-game="rush-line">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Rush Line</h1>
    <div class="stats">
      <span>Moves<b id="turn">0</b></span>
      <span>Yours<b id="mine">14</b></span>
      <span>Theirs<b id="theirs">14</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help">Tap a piece, then a square · one step forward, capture only diagonally · reach the far row first</p>
