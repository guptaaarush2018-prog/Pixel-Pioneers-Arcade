<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1230"/><stop offset=".7" stop-color="#2a2f6b"/><stop offset="1" stop-color="#4b3a7a"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4157"/><stop offset="1" stop-color="#262b3a"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd86b"/><stop offset="1" stop-color="#f0a21f"/></linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ef0ff" stop-opacity="0"/><stop offset="1" stop-color="#9ef0ff" stop-opacity=".16"/></linearGradient>
    <radialGradient id="boom"><stop offset="0" stop-color="#fff6c2"/><stop offset=".45" stop-color="#ffb347" stop-opacity=".85"/><stop offset="1" stop-color="#ff6b3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ef0ff"/><stop offset="1" stop-color="#3a9bd9"/></linearGradient>
    <filter id="ds" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity=".5"/></filter>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="20" cy="14" r=".8"/><circle cx="64" cy="40" r="1"/><circle cx="140" cy="10" r=".8"/><circle cx="210" cy="26" r="1"/><circle cx="296" cy="12" r=".9"/><circle cx="250" cy="56" r=".7"/><circle cx="100" cy="70" r=".7"/></g>
  <!-- rain streaks -->
  <g stroke="#9ef0ff" stroke-opacity=".18" stroke-width="1"><path d="M30 0l-6 40"/><path d="M120 30l-6 40"/><path d="M190 0l-6 40"/><path d="M280 40l-6 40"/><path d="M60 90l-6 40"/><path d="M240 100l-6 40"/></g>
  <!-- skyline -->
  <g fill="#1a1d3d"><rect x="0" y="150" width="30" height="30"/><rect x="32" y="136" width="22" height="44"/><rect x="56" y="156" width="26" height="24"/><rect x="230" y="140" width="24" height="40"/><rect x="256" y="154" width="30" height="26"/><rect x="288" y="132" width="32" height="48"/></g>
  <g fill="#ffd98a" opacity=".6"><rect x="38" y="142" width="3" height="4"/><rect x="46" y="150" width="3" height="4"/><rect x="236" y="148" width="3" height="4"/><rect x="296" y="140" width="3" height="4"/><rect x="306" y="152" width="3" height="4"/></g>
  <rect x="0" y="178" width="320" height="22" fill="#232833"/>
  <rect x="0" y="178" width="320" height="2" fill="#3a4157"/>

  <!-- falling words -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-weight="800" font-size="15">
    <g transform="translate(20 22)">
      <rect x="0" y="-36" width="66" height="36" fill="url(#streak)"/>
      <rect width="66" height="24" rx="6" fill="url(#tile)" filter="url(#ds)"/><text x="33" y="17" text-anchor="middle" fill="#eceef2">planet</text>
    </g>
    <g transform="translate(212 50)">
      <rect x="0" y="-40" width="56" height="40" fill="url(#streak)"/>
      <rect width="56" height="24" rx="6" fill="url(#tile)" filter="url(#ds)"/><text x="28" y="17" text-anchor="middle" fill="#eceef2">wave</text>
    </g>
    <g transform="translate(244 104)">
      <rect x="0" y="-40" width="64" height="40" fill="url(#streak)"/>
      <rect width="64" height="24" rx="6" fill="url(#tile)" filter="url(#ds)"/><text x="32" y="17" text-anchor="middle" fill="#eceef2">storm</text>
    </g>
    <!-- the word being typed -->
    <g transform="translate(96 82)">
      <rect x="0" y="-40" width="92" height="40" fill="url(#streak)"/>
      <rect x="-3" y="-3" width="98" height="30" rx="8" fill="none" stroke="#ffe066" stroke-width="2" opacity=".8"/>
      <rect width="92" height="24" rx="6" fill="url(#tile)" filter="url(#ds)"/>
      <text x="46" y="17" text-anchor="middle"><tspan fill="#ffc53d">thun</tspan><tspan fill="#eceef2">der</tspan></text>
    </g>
  </g>
  <!-- a word just blasted -->
  <circle cx="58" cy="108" r="22" fill="url(#boom)"/>
  <g fill="#ffe066"><rect x="34" y="96" width="5" height="3" transform="rotate(30 34 96)"/><rect x="78" y="94" width="5" height="3" transform="rotate(-30 78 94)"/><rect x="44" y="124" width="4" height="3"/><rect x="72" y="122" width="4" height="3" transform="rotate(50 72 122)"/></g>
  <text x="58" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="14" fill="#9be37a" paint-order="stroke" stroke="rgba(0,0,0,.6)" stroke-width="4" stroke-linejoin="round">+60</text>
  <!-- shields: one ground segment each -->
  <g><rect x="12" y="187" width="52" height="6" rx="3" fill="#4f8cff"/><rect x="72" y="187" width="52" height="6" rx="3" fill="#4f8cff"/><rect x="132" y="187" width="52" height="6" rx="3" fill="#4f8cff"/><rect x="192" y="187" width="52" height="6" rx="3" fill="#4f8cff"/><rect x="252" y="187" width="52" height="6" rx="3" fill="#2a2f39"/></g>
  <text x="306" y="170" text-anchor="end" font-family="system-ui,sans-serif" font-weight="800" font-size="12" fill="#cfd5e0" paint-order="stroke" stroke="rgba(0,0,0,.5)" stroke-width="3">Streak 12 · x3</text>
</svg>
