<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Gravity Four · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
</head>
<body class="game" data-game="gravity-four">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Gravity Four</h1>
    <div class="stats">
      <span>Turn<b id="turn">-</b></span>
      <span>Tilts left<b id="tilt">1</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <div class="toolbar">
    <button class="btn secondary" type="button" id="tilt-l" disabled>⟲ Tilt left (Q)</button>
    <button class="btn secondary" type="button" id="tilt-r" disabled>Tilt right (E) ⟳</button>
  </div>
  <p class="help">Click a column or press <kbd>1</kbd>–<kbd>7</kbd> to drop · <kbd>Q</kbd> / <kbd>E</kbd> tilt the board once per game</p>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/filter.js"></script>
  <script src="../../assets/js/friends.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/chat.js"></script>
  <script src="../../assets/js/invites.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="../../assets/js/match.js"></script>
  <script src="game.js"></script>
</body>
</html>
