<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Box Battle · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
</head>
<body class="game" data-game="box-battle">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Box Battle</h1>
    <div class="stats">
      <span>You<b id="you">0</b></span>
      <span>Them<b id="them">0</b></span>
      <span>Turn<b id="turn">-</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help">Click or tap between two dots to draw a line</p>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="game.js"></script>
</body>
</html>
