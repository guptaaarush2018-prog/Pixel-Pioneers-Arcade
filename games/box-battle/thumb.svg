<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".45" r=".8"><stop offset="0" stop-color="#232838"/><stop offset="1" stop-color="#0f1116"/></radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d212b"/><stop offset="1" stop-color="#14171e"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc53d" stop-opacity=".38"/><stop offset="1" stop-color="#ffc53d" stop-opacity=".16"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8cff" stop-opacity=".4"/><stop offset="1" stop-color="#4f8cff" stop-opacity=".16"/></linearGradient>
    <radialGradient id="dot" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#aab2c0"/></radialGradient>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".55"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <!-- board: a 5x5 field of boxes, 30px apart -->
  <rect x="78" y="14" width="172" height="172" rx="14" fill="url(#board)" filter="url(#ds)"/>
  <rect x="78.5" y="14.5" width="171" height="171" rx="14" fill="none" stroke="#fff" stroke-opacity=".07"/>
  <g transform="translate(89 25)">
    <!-- claimed boxes -->
    <g>
      <rect x="3" y="3" width="24" height="24" rx="4" fill="url(#gold)"/><rect x="33" y="3" width="24" height="24" rx="4" fill="url(#gold)"/>
      <rect x="3" y="33" width="24" height="24" rx="4" fill="url(#gold)"/>
      <rect x="93" y="63" width="24" height="24" rx="4" fill="url(#blue)"/><rect x="93" y="93" width="24" height="24" rx="4" fill="url(#blue)"/><rect x="123" y="93" width="24" height="24" rx="4" fill="url(#blue)"/>
    </g>
    <g font-family="system-ui,sans-serif" font-weight="800" font-size="13" text-anchor="middle">
      <text x="15" y="20" fill="#ffc53d">Y</text><text x="45" y="20" fill="#ffc53d">Y</text><text x="15" y="50" fill="#ffc53d">Y</text>
      <text x="105" y="80" fill="#4f8cff">C</text><text x="105" y="110" fill="#4f8cff">C</text><text x="135" y="110" fill="#4f8cff">C</text>
    </g>
    <!-- empty lines -->
    <g stroke="#2a3040" stroke-width="3" stroke-linecap="round"><path d="M0 0H150M0 30H150M0 60H150M0 90H150M0 120H150M0 150H150M0 0V150M30 0V150M60 0V150M90 0V150M120 0V150M150 0V150"/></g>
    <!-- drawn lines -->
    <g stroke-width="4.5" stroke-linecap="round" filter="url(#glow)">
      <path d="M0 0H60M0 30H60M0 60H30M0 0V60M30 0V60M60 0V30M90 120V150M0 120H30M60 150H90" stroke="#ffc53d"/>
      <path d="M90 60H120M90 90H150M90 120H150M90 60V120M120 60V120M150 90V120M120 0H150M150 0V30M30 90V120" stroke="#4f8cff"/>
    </g>
    <!-- the line you're hovering -->
    <path d="M60 30V60" stroke="#ffc53d" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>
    <!-- dots -->
    <g fill="url(#dot)">
      <circle cx="0" cy="0" r="3.6"/><circle cx="30" cy="0" r="3.6"/><circle cx="60" cy="0" r="3.6"/><circle cx="90" cy="0" r="3.6"/><circle cx="120" cy="0" r="3.6"/><circle cx="150" cy="0" r="3.6"/>
      <circle cx="0" cy="30" r="3.6"/><circle cx="30" cy="30" r="3.6"/><circle cx="60" cy="30" r="3.6"/><circle cx="90" cy="30" r="3.6"/><circle cx="120" cy="30" r="3.6"/><circle cx="150" cy="30" r="3.6"/>
      <circle cx="0" cy="60" r="3.6"/><circle cx="30" cy="60" r="3.6"/><circle cx="60" cy="60" r="3.6"/><circle cx="90" cy="60" r="3.6"/><circle cx="120" cy="60" r="3.6"/><circle cx="150" cy="60" r="3.6"/>
      <circle cx="0" cy="90" r="3.6"/><circle cx="30" cy="90" r="3.6"/><circle cx="60" cy="90" r="3.6"/><circle cx="90" cy="90" r="3.6"/><circle cx="120" cy="90" r="3.6"/><circle cx="150" cy="90" r="3.6"/>
      <circle cx="0" cy="120" r="3.6"/><circle cx="30" cy="120" r="3.6"/><circle cx="60" cy="120" r="3.6"/><circle cx="90" cy="120" r="3.6"/><circle cx="120" cy="120" r="3.6"/><circle cx="150" cy="120" r="3.6"/>
      <circle cx="0" cy="150" r="3.6"/><circle cx="30" cy="150" r="3.6"/><circle cx="60" cy="150" r="3.6"/><circle cx="90" cy="150" r="3.6"/><circle cx="120" cy="150" r="3.6"/><circle cx="150" cy="150" r="3.6"/>
    </g>
  </g>
  <!-- scores, as in the top bar -->
  <g font-family="system-ui,sans-serif" font-weight="800" text-anchor="middle">
    <rect x="14" y="70" width="52" height="60" rx="10" fill="#1d212b" stroke="#ffc53d" stroke-opacity=".6" filter="url(#ds)"/>
    <text x="40" y="90" font-size="9" fill="#cfd5e0" letter-spacing=".5">YOU</text>
    <text x="40" y="118" font-size="24" fill="#ffc53d">3</text>
    <rect x="262" y="70" width="52" height="60" rx="10" fill="#1d212b" stroke="#4f8cff" stroke-opacity=".35" filter="url(#ds)"/>
    <text x="288" y="90" font-size="9" fill="#cfd5e0" letter-spacing=".5">THEM</text>
    <text x="288" y="118" font-size="24" fill="#4f8cff">3</text>
  </g>
</svg>
