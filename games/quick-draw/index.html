<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Quick Draw · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
</head>
<body class="game" data-game="quick-draw">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Quick Draw</h1>
    <div class="stats">
      <span>You<b id="you">0</b></span>
      <span>Them<b id="them">0</b></span>
      <span>Outlaw<b id="foe">-</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help">Wait for <b>DRAW!</b>, then press <kbd>Space</kbd>, click, or tap · two players: <kbd>A</kbd> vs <kbd>L</kbd></p>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/filter.js"></script>
  <script src="../../assets/js/friends.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/chat.js"></script>
  <script src="../../assets/js/invites.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="../../assets/js/match.js"></script>
  <script src="game.js"></script>
</body>
</html>
