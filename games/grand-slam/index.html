<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Grand Slam · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
</head>
<body class="game" data-game="grand-slam">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Grand Slam</h1>
    <div class="stats">
      <span>Score<b id="score">0 – 0</b></span>
      <span>Inning<b id="inning">▲1</b></span>
      <span>Count<b id="count">0-0, 0 out</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help"><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> or mouse aim · <kbd>Space</kbd> / click pitch or swing · <kbd>1</kbd>–<kbd>4</kbd> pick a pitch · <kbd>R</kbd> steal · <kbd>P</kbd> pause</p>
  <div class="touchpad">
    <button id="t-steal" type="button">Steal</button>
    <button id="t-act" type="button">Pitch</button>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/filter.js"></script>
  <script src="../../assets/js/friends.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/chat.js"></script>
  <script src="../../assets/js/invites.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="../../assets/js/versus.js"></script>
  <script src="../../assets/js/sports.js"></script>
  <script src="field.js"></script>
  <script src="game.js"></script>
</body>
</html>
