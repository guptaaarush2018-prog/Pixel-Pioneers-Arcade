<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a1a"/><stop offset=".5" stop-color="#1d1140"/><stop offset="1" stop-color="#0b0a1a"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff4fd8" stop-opacity="0"/><stop offset="1" stop-color="#ff4fd8" stop-opacity=".9"/></linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#6b4cff" stroke-opacity=".18"/></pattern>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect y="32" width="320" height="136" fill="url(#grid)"/>
  <!-- distant city -->
  <g fill="#2a1a5c" opacity=".8">
    <rect x="10" y="74" width="18" height="60"/><rect x="34" y="60" width="14" height="74"/><rect x="200" y="66" width="20" height="68"/><rect x="226" y="82" width="12" height="52"/><rect x="290" y="70" width="22" height="64"/>
  </g>
  <!-- speed lines -->
  <g stroke="#fff" stroke-opacity=".25" stroke-width="1.5" stroke-linecap="round">
    <path d="M240 56h60"/><path d="M200 140h50"/><path d="M262 100h48"/><path d="M8 50h30"/><path d="M14 150h40"/>
  </g>

  <!-- ceiling and floor -->
  <g filter="url(#glow)">
    <rect x="0" y="28" width="320" height="4" fill="#3ef0ff"/>
    <rect x="0" y="168" width="320" height="4" fill="#ff4fd8"/>
  </g>
  <rect x="0" y="0" width="320" height="28" fill="#0e1430"/>
  <rect x="0" y="172" width="320" height="28" fill="#1f0e2e"/>

  <!-- spikes -->
  <g fill="#ff4fd8" filter="url(#glow)">
    <path d="M24 168l9-16 9 16z"/><path d="M42 168l9-16 9 16z"/><path d="M262 168l9-16 9 16z"/>
  </g>
  <g fill="#3ef0ff" filter="url(#glow)">
    <path d="M240 32l9 16 9-16z"/><path d="M258 32l9 16 9-16z"/><path d="M296 32l9 16 9-16z"/>
  </g>

  <!-- polarity gate: cyan wall on the ceiling side -->
  <g filter="url(#glow)">
    <rect x="216" y="32" width="10" height="56" rx="3" fill="#3ef0ff" opacity=".85"/>
    <rect x="216" y="118" width="10" height="50" rx="3" fill="#ff4fd8" opacity=".85"/>
  </g>

  <!-- swinging saw -->
  <path d="M170 32 L150 92" stroke="#8d94a1" stroke-width="2"/>
  <g transform="translate(150 96)">
    <circle r="15" fill="#c9d1d9"/>
    <g fill="#c9d1d9"><path d="M0-19l4 5h-8z"/><path d="M0 19l4-5h-8z"/><path d="M-19 0l5 4v-8z"/><path d="M19 0l-5 4v-8z"/><path d="M13-13l-1 6-5-5z"/><path d="M-13 13l1-6 5 5z"/><path d="M13 13l-6-1 5-5z"/><path d="M-13-13l6 1-5 5z"/></g>
    <circle r="5" fill="#5b6270"/>
  </g>

  <!-- flip arc + trail -->
  <path d="M60 160 C86 150 92 54 120 40" fill="none" stroke="url(#trail)" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  <g fill="#ff4fd8" opacity=".35"><rect x="58" y="144" width="16" height="16" rx="3"/><rect x="72" y="118" width="16" height="16" rx="3" opacity=".7"/><rect x="82" y="88" width="16" height="16" rx="3" opacity=".9"/></g>
  <!-- the runner, flipped to the ceiling -->
  <g transform="translate(112 34) rotate(160 13 13)" filter="url(#glow)">
    <rect width="26" height="26" rx="5" fill="url(#cube)"/>
    <rect x="6" y="8" width="5" height="7" rx="1" fill="#1b1e24"/><rect x="15" y="8" width="5" height="7" rx="1" fill="#1b1e24"/>
  </g>

  <!-- shards -->
  <g fill="#ffd23f" filter="url(#glow)">
    <path d="M182 128l5 8-5 8-5-8z"/><path d="M198 128l5 8-5 8-5-8z"/><path d="M276 70l5 8-5 8-5-8z"/>
  </g>

  <g font-family="system-ui,-apple-system,sans-serif" font-weight="900" paint-order="stroke" stroke="rgba(0,0,0,.6)" stroke-width="4" stroke-linejoin="round">
    <text x="14" y="20" font-size="13" fill="#3ef0ff">POLARITY GATES</text>
    <text x="306" y="20" text-anchor="end" font-size="13" fill="#ffd23f">COMBO ×5</text>
  </g>
</svg>
