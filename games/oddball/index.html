<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Oddball · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
  <style>
    .ob {
      position: relative;
      width: min(720px, 100%);
      max-height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background:
        radial-gradient(120% 90% at 0% 0%, rgba(176, 124, 255, .16), transparent 60%),
        radial-gradient(120% 90% at 100% 100%, rgba(255, 197, 61, .12), transparent 55%),
        var(--surface);
    }
    .ob:empty { display: none; }
    .ob-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
    .ob-pips { display: flex; gap: 6px; }
    .ob-pips i { width: 26px; height: 8px; border-radius: 4px; background: var(--line); }
    .ob-pips i.now { background: var(--text); }
    .ob-pips i.t0 { background: #9aa3b5; } .ob-pips i.t1 { background: #3ccf8e; } .ob-pips i.t2 { background: #4f8cff; }
    .ob-pips i.t3 { background: #b07cff; } .ob-pips i.t4 { background: #ffc53d; } .ob-pips i.miss { background: #5a2a30; }
    .ob-score { font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
    .ob-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
    .ob-bar i { display: block; height: 100%; background: linear-gradient(90deg, #b07cff, #4f8cff); transition: width .1s linear; }
    .ob-bar i.low { background: #ff6b6b; }
    .ob-q { text-align: center; font-size: clamp(21px, 3.6vw, 30px); font-weight: 800; line-height: 1.25; min-height: 2.5em; display: grid; place-items: center; text-wrap: balance; }
    .ob-hint { text-align: center; margin: -8px 0 0; color: var(--muted); font-size: 13px; }
    .ob-form { display: flex; gap: 8px; }
    .ob-form input { flex: 1; font-size: 20px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); color: var(--text); font-family: var(--font); min-width: 0; }
    .ob-form input:focus { outline: none; border-color: #b07cff; }
    .ob-form input.shake { animation: ob-shake .35s; border-color: #ff6b6b; }
    @keyframes ob-shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    .ob-msg { text-align: center; min-height: 1.3em; font-size: 14px; color: var(--muted); }
    .ob-msg.bad { color: #ff8a80; }
    .ob-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .ob-reveal { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0 2px; }
    .ob-ans { font-size: 26px; font-weight: 800; text-transform: capitalize; }
    .ob-badge {
      --c: #9aa3b5;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 18px; border-radius: 999px;
      font-weight: 900; font-size: 18px; letter-spacing: .06em; text-transform: uppercase;
      color: #111; background: var(--c);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent), 0 8px 30px color-mix(in srgb, var(--c) 45%, transparent);
      animation: ob-pop .5s cubic-bezier(.2, 1.6, .4, 1) both;
    }
    @keyframes ob-pop { from { transform: scale(.3) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
    .ob-pts { font-size: 15px; color: var(--muted); animation: ob-rise .5s .15s both; }
    .ob-pts b { color: var(--text); font-size: 20px; }
    @keyframes ob-rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
    .ob-meter { width: min(420px, 100%); display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; animation: ob-rise .5s .25s both; }
    .ob-meter span { flex: 1; background: var(--line); }
    .ob-meter span.on { background: var(--c); }
    .ob-cards { display: grid; gap: 10px; }
    .ob-card { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border-left: 5px solid var(--c, var(--line)); display: grid; gap: 4px; }
    .ob-card h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--muted); }
    .ob-card .mine { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 18px; font-weight: 800; text-transform: capitalize; }
    .ob-card .mine small { font-size: 12px; font-weight: 800; color: var(--c); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
    .ob-card .top { font-size: 12px; color: var(--muted); text-transform: capitalize; }
    .ob-total { text-align: center; }
    .ob-total b { font-size: 40px; display: block; line-height: 1.1; }
    .ob-share { font-family: ui-monospace, monospace; font-size: 22px; letter-spacing: 2px; text-align: center; }
    .ob-confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; }
    .ob-confetti i { position: absolute; width: 8px; height: 12px; border-radius: 2px; animation: ob-fall 1.4s ease-in forwards; }
    @keyframes ob-fall { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), 420px) rotate(var(--r)); opacity: 0; } }
    .ob-tiers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 8px 0; }
    .ob-tiers span { padding: 6px 2px; border-radius: 8px; font-size: 11px; font-weight: 800; text-align: center; color: #111; line-height: 1.3; }
    .ob-tiers small { display: block; font-weight: 700; opacity: .75; }
    @media (max-width: 560px) { .ob { padding: 12px; gap: 10px; } .ob-pips i { width: 18px; } }
  </style>
</head>
<body class="game" data-game="oddball">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Oddball</h1>
    <div class="stats">
      <span>Score<b id="score">0</b></span>
      <span>Round<b id="round">-</b></span>
      <span>Best<b id="best">0</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <div class="ob" id="ob"></div>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help">Type an answer and press <kbd>Enter</kbd> · the fewer people who say it, the more it's worth · wrong answers cost 3 seconds · <kbd>Esc</kbd> to pass</p>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/gfx.js"></script>
  <script src="../../assets/js/filter.js"></script>
  <script src="../../assets/js/friends.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/chat.js"></script>
  <script src="../../assets/js/invites.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="../../assets/js/versus.js"></script>
  <script src="prompts.js"></script>
  <script src="game.js"></script>
</body>
</html>
