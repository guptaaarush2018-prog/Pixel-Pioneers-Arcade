<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Tankfield · Pixel Pioneers Arcade</title>

<body class="game" data-game="tankfield">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Tankfield</h1>
    <div class="stats">
      <span>XP<b id="xp">0</b></span>
      <span>Level<b id="lvl">-</b></span>
      <span>Best<b id="best">0</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help"><kbd>WASD</kbd> drive · auto-aim fires by itself (<kbd>Q</kbd> mouse aim, <kbd>E</kbd> auto-fire) · <kbd>1</kbd>–<kbd>7</kbd> upgrade stats · <kbd>P</kbd> pause</p>
