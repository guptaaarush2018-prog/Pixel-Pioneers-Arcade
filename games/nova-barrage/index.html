<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Nova Barrage · Pixel Pioneers Arcade</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
</head>
<body class="game" data-game="nova-barrage">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Nova Barrage</h1>
    <div class="stats">
      <span>Score<b id="score">0</b></span>
      <span>Multiplier<b id="mult">×1.0</b></span>
      <span>Best<b id="best">0</b></span>
    </div>
    <button class="icon-btn" id="mute" type="button">Sound on</button>
  </header>

  <main class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <p class="help"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> move · hold <kbd>Shift</kbd> to slow down · <kbd>Space</kbd> or <kbd>X</kbd> bomb · <kbd>P</kbd> pause</p>
  <div class="touchpad">
    <button id="pause-btn" type="button">Pause</button>
    <button id="bomb-btn" type="button">Bomb</button>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/arcade.js"></script>
  <script src="../../assets/js/filter.js"></script>
  <script src="../../assets/js/friends.js"></script>
  <script src="../../assets/js/online.js"></script>
  <script src="../../assets/js/chat.js"></script>
  <script src="../../assets/js/invites.js"></script>
  <script src="../../assets/js/relay.js"></script>
  <script src="../../assets/js/versus.js"></script>
  <script src="game.js"></script>
</body>
</html>
