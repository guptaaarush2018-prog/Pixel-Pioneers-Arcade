<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fa8ee"/><stop offset="1" stop-color="#bfe3ff"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f7fd6"/><stop offset="1" stop-color="#2a5fae"/></linearGradient>
    <!-- one isometric block: top, left, right faces -->
    <symbol id="grass" viewBox="0 0 40 40"><polygon points="20,0 40,10 20,20 0,10" fill="#5fae3e"/><polygon points="0,10 20,20 20,40 0,30" fill="#8a5f3a"/><polygon points="0,10 20,20 20,24 0,14" fill="#4f9433"/><polygon points="20,20 40,10 40,30 20,40" fill="#6b4a2d"/><polygon points="20,20 40,10 40,14 20,24" fill="#3f7d29"/></symbol>
    <symbol id="stone" viewBox="0 0 40 40"><polygon points="20,0 40,10 20,20 0,10" fill="#9a9ca0"/><polygon points="0,10 20,20 20,40 0,30" fill="#7d7f83"/><polygon points="20,20 40,10 40,30 20,40" fill="#626468"/></symbol>
    <symbol id="sand" viewBox="0 0 40 40"><polygon points="20,0 40,10 20,20 0,10" fill="#ecdc9f"/><polygon points="0,10 20,20 20,40 0,30" fill="#d3c283"/><polygon points="20,20 40,10 40,30 20,40" fill="#b9a96c"/></symbol>
    <symbol id="leaf" viewBox="0 0 40 40"><polygon points="20,0 40,10 20,20 0,10" fill="#4aa03e"/><polygon points="0,10 20,20 20,40 0,30" fill="#3a8a31"/><polygon points="20,20 40,10 40,30 20,40" fill="#2d7027"/><g fill="#235a1f"><rect x="6" y="18" width="3" height="3"/><rect x="12" y="26" width="3" height="3"/><rect x="28" y="22" width="3" height="3"/><rect x="32" y="16" width="3" height="3"/></g></symbol>
    <symbol id="log" viewBox="0 0 40 40"><polygon points="20,0 40,10 20,20 0,10" fill="#bf9460"/><polygon points="0,10 20,20 20,40 0,30" fill="#6e4c2c"/><polygon points="20,20 40,10 40,30 20,40" fill="#553a20"/><g fill="#58391f"><rect x="5" y="14" width="2" height="18"/><rect x="12" y="18" width="2" height="18"/><rect x="26" y="18" width="2" height="18"/><rect x="33" y="14" width="2" height="18"/></g></symbol>
    <symbol id="crystal" viewBox="0 0 40 40"><use href="#stone"/><g fill="#5ef2ff"><rect x="5" y="16" width="4" height="4"/><rect x="12" y="25" width="4" height="4"/><rect x="25" y="19" width="4" height="4"/><rect x="32" y="27" width="4" height="4"/><rect x="18" y="5" width="5" height="3"/></g></symbol>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".35"/></filter>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <rect x="236" y="22" width="22" height="22" fill="#fff6c4"/>
  <g fill="#fff" opacity=".9"><rect x="20" y="24" width="60" height="10"/><rect x="34" y="18" width="30" height="8"/><rect x="190" y="52" width="50" height="8"/></g>
  <rect y="132" width="320" height="68" fill="url(#sea)"/>
  <g filter="url(#ds)">
    <!-- island, back to front -->
    <use href="#stone" x="140" y="58" width="40" height="40"/>
    <use href="#grass" x="120" y="68" width="40" height="40"/><use href="#grass" x="160" y="68" width="40" height="40"/>
    <use href="#grass" x="100" y="78" width="40" height="40"/><use href="#grass" x="140" y="78" width="40" height="40"/><use href="#grass" x="180" y="78" width="40" height="40"/>
    <use href="#sand" x="80" y="88" width="40" height="40"/><use href="#grass" x="120" y="88" width="40" height="40"/><use href="#crystal" x="160" y="88" width="40" height="40"/><use href="#grass" x="200" y="88" width="40" height="40"/>
    <use href="#sand" x="100" y="98" width="40" height="40"/><use href="#grass" x="140" y="98" width="40" height="40"/><use href="#stone" x="180" y="98" width="40" height="40"/><use href="#sand" x="220" y="98" width="40" height="40"/>
    <use href="#sand" x="120" y="108" width="40" height="40"/><use href="#sand" x="160" y="108" width="40" height="40"/><use href="#sand" x="200" y="108" width="40" height="40"/>
    <!-- tree on the island -->
    <use href="#log" x="120" y="48" width="40" height="40"/><use href="#log" x="120" y="28" width="40" height="40"/>
    <use href="#leaf" x="100" y="18" width="40" height="40"/><use href="#leaf" x="140" y="18" width="40" height="40"/><use href="#leaf" x="120" y="8" width="40" height="40"/><use href="#leaf" x="120" y="-2" width="40" height="40"/>
    <!-- a gloom -->
    <g transform="translate(196 62)">
      <polygon points="14,0 28,7 14,14 0,7" fill="#9a6cf5"/><polygon points="0,7 14,14 14,30 0,23" fill="#7d4fe0"/><polygon points="14,14 28,7 28,23 14,30" fill="#6a3fc8"/>
      <rect x="2.5" y="13" width="3.5" height="4" fill="#0d0d1a"/><rect x="8" y="16" width="3.5" height="4" fill="#0d0d1a"/>
    </g>
  </g>
  <!-- pickaxe -->
  <g transform="translate(250 120) rotate(-30)">
    <rect x="-3" y="-4" width="6" height="58" fill="#8c6a3e"/><rect x="-26" y="-10" width="52" height="9" rx="2" fill="#5ef2ff"/><rect x="-26" y="-10" width="52" height="3" fill="#c8fbff"/>
  </g>
  <!-- hotbar -->
  <g transform="translate(76 168)">
    <rect width="168" height="26" rx="4" fill="#0f121a" fill-opacity=".8"/>
    <rect x="2" y="2" width="22" height="22" fill="none" stroke="#fff" stroke-width="2"/>
    <use href="#grass" x="5" y="4" width="16" height="16"/><use href="#log" x="29" y="4" width="16" height="16"/><use href="#stone" x="53" y="4" width="16" height="16"/><use href="#crystal" x="77" y="4" width="16" height="16"/><use href="#sand" x="101" y="4" width="16" height="16"/>
  </g>
</svg>
