<body class="game" data-game="volt-grid">
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>

      <span>Score<b id="score">0</b></span>
      <span>Clock<b id="clock">75s</b></span>
      <span>Boards<b id="boards">0</b></span>

    <canvas id="game"></canvas>

  <p class="help">Click a tile to turn it, right-click or <kbd>Shift</kbd>-click to turn back · light every tile from the ⚡ generator · arrows + <kbd>Space</kbd> also work · <kbd>P</kbd> pause</p>
