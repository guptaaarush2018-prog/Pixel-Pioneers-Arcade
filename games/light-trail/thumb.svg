<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#121a2c"/><stop offset="1" stop-color="#05070b"/></radialGradient>
    <filter id="glowB" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="head" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="cellsB" width="6" height="6" patternUnits="userSpaceOnUse"><rect x=".5" y=".5" width="5" height="5" fill="#3de0ff" fill-opacity=".75"/></pattern>
    <pattern id="cellsO" width="6" height="6" patternUnits="userSpaceOnUse"><rect x=".5" y=".5" width="5" height="5" fill="#ff9a3d" fill-opacity=".75"/></pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2230" stop-opacity=".9"/><stop offset="1" stop-color="#0e1014" stop-opacity=".9"/></linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <g stroke="#506ea0" stroke-opacity=".14" stroke-width="1"><path d="M24 0V200M48 0V200M72 0V200M96 0V200M120 0V200M144 0V200M168 0V200M192 0V200M216 0V200M240 0V200M264 0V200M288 0V200M312 0V200M0 24H320M0 48H320M0 72H320M0 96H320M0 120H320M0 144H320M0 168H320M0 192H320"/></g>
  <!-- the arena has started to shrink -->
  <path d="M0 0H320V200H0Z M18 18V182H302V18Z" fill="#ff5f6d" fill-opacity=".16" fill-rule="evenodd"/>
  <rect x="18" y="18" width="284" height="164" fill="none" stroke="#ff5f6d" stroke-width="2" filter="url(#glowB)" opacity=".9"/>
  <!-- trails: rows of cells, like the game draws them -->
  <g fill="none" stroke-width="6" stroke-linejoin="miter" filter="url(#glowB)">
    <path d="M39 99H117V45H207V93H189" stroke="url(#cellsB)"/>
    <path d="M279 99H237V153H123V129H171" stroke="url(#cellsO)"/>
  </g>
  <!-- racer heads: blue is boosting (brighter glow), orange is cruising -->
  <rect x="178" y="88" width="10" height="10" fill="#fff" filter="url(#head)"/>
  <rect x="178" y="88" width="10" height="10" fill="#fff" filter="url(#head)"/>
  <rect x="172" y="124" width="10" height="10" fill="#fff" filter="url(#head)"/>
  <g fill="#3de0ff" opacity=".35"><circle cx="183" cy="93" r="14"/></g>
  <g fill="#ff9a3d" opacity=".22"><circle cx="177" cy="129" r="10"/></g>
  <!-- boost meters -->
  <g font-family="system-ui,sans-serif" font-weight="700" font-size="8" fill="#eceef2">
    <rect x="24" y="24" width="74" height="16" rx="4" fill="url(#card)"/>
    <text x="28" y="31">You · BOOST</text>
    <rect x="28" y="34" width="44" height="3" rx="1.5" fill="#3de0ff"/>
    <rect x="222" y="24" width="74" height="16" rx="4" fill="url(#card)"/>
    <text x="226" y="31">Bot</text>
    <rect x="226" y="34" width="66" height="3" rx="1.5" fill="#ff9a3d"/>
  </g>
</svg>
